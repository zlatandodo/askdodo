name: 🏆 Momentum Focus List (Sabato 07:00 IT)

on:
  schedule:
    # 05:00 UTC = 07:00 CEST (estate) / 06:00 CET (inverno)
    - cron: '0 5 * * 6'
  workflow_dispatch:

jobs:
  run-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # necessario per il commit della focus list

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}"             >> .env
          echo "EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}"       >> .env

      - name: Run Momentum Weekly Scanner
        run: python momentum_weekly.py

      - name: Commit focus list to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p db
          git add db/momentum_focus_list.json
          git diff --staged --quiet || git commit -m "feat(momentum): update focus list $(date -u +%Y-%m-%d)"
          git push

      - name: Upload output (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-output-${{ github.run_id }}
          path: output/
          retention-days: 7
